<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Weather App</title>
</head>

<body>

    <div id="message"></div>

    <div class="eart-i" id="eart-i">
        <div class="eart" id="eart">
            <p id="eart-title">地震情報</p>
            <p>地震の詳細は以下の通りです。</p>
            <h4 id="eart-info"></h4>
            <h2 id="eart-note"></h2>
            <h4 id="eart-time"></h4>
        </div>
    </div>




    <div class="Weather">
        <div class="container">
            <h2>天気情報</h2>
            <h4>都道府県名を入力してその天気情報を取得してください<i class="bi bi-geo-alt"></i></h4>

            <div class="search">
                <input type="text" id="search-box" placeholder="都道府県名">
                <button id="search-button">検索<i class="bi bi-search"></i></button>

                <div class="weather-info" id="weather-info">
                    <h3 id="city-name"><i class="bi bi-geo-alt-fill"></i></h3>
                    <h3 id="weather-description">
                        <i id="weather-icon"></i>
                        <span id="weather-text"></span>
                    </h3>
                    <p id="temperature"><i class="bi bi-thermometer"></i></p>
                    <p id="humidity"><i class="bi bi-droplet"></i></p>
                    <p id="wind-speed"><i class="bi bi-wind"></i></p>

                </div>

            </div>
        </div>


        <script src="./js/index.js"></script>
        <script src="./js/eart.js"></script>

        <script src="https://cdn.amplitude.com/script/d834d056cd553b7534a1e9ae1891c085.js"></script>
        <script>window.amplitude.add(window.sessionReplay.plugin({ sampleRate: 1 })); window.amplitude.init('d834d056cd553b7534a1e9ae1891c085', { "fetchRemoteConfig": true, "autocapture": true });</script>
</body>

</html>
